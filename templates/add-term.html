{% extends "modelo.html" %} {% block conteudo %}
<link
  rel="stylesheet"
  href="{{
url_for('static', filename='add-term/add-termStyles.css') }}"
/>

<title>PythonSOS | Add Term</title>

<h1>Add Term</h1>

<div class="container">
  <h2>Term:</h2>
  <input
    type="text"
    class="termo validate"
    id="termo"
    placeholder="Term name"
  />

  <h2>Term definition:</h2>
  <textarea
    type="text"
    class="definicao validate"
    id="definicao"
    placeholder="Term description"
    maxlength="300"
  ></textarea>

  <div class="char-counter"><span id="counter">0</span> / 300</div>

  <a href="/glossario" id="button">Add</a>
</div>

<script src="{{ url_for('static', filename='js/add-term.js') }}"></script>
{% endblock %}
